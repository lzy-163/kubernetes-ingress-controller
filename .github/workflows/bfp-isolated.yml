        print(f''producer output={value!r}'')

        raise SystemExit(value != ''available'')

        PY'
  human_build-push-images:
    runs-on: ubuntu-latest
    outputs:
      probe: ${{ steps.write.outputs.probe }}
    steps:
    - id: write
      run: echo "probe=available" >> "$GITHUB_OUTPUT"
  human_setup-e2e-tests:
    runs-on: ubuntu-latest
    outputs:
      probe: ${{ steps.write.outputs.probe }}
    steps:
    - id: write
      run: echo "probe=available" >> "$GITHUB_OUTPUT"
  human_test-current-kubernetes:
